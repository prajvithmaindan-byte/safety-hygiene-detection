<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HygieneGuard — Live Monitor</title>
  <link rel="stylesheet" href="css/style.css">
  <link rel="stylesheet" href="css/intro.css">
</head>
<body>

<!-- Dynamic High-Tech Looping Video Background Backdrop -->
<div class="video-bg-container">
  <video autoplay loop muted playsinline class="video-bg">
    <!-- Super robust, beautiful default public wireframe stream loop -->
    <source src="https://assets.mixkit.co/videos/preview/mixkit-tunnel-of-futuristic-blue-neon-lights-34259-large.mp4" type="video/mp4">
  </video>
  <div class="video-bg-overlay"></div>
</div>

<!-- PREMIUM Cyberpunk Particle Intro Splash Overlay -->
<div id="introSplash" class="intro-splash">
  <canvas id="introCanvas"></canvas>
  <div class="intro-content">
    <div class="intro-logo">⬡ HYGIENEGUARD</div>
    <div class="intro-subtitle">AI VIGILANCE SECURITY CORE</div>
    <div class="intro-loader-container">
      <div class="intro-loader-bar" id="introLoaderBar"></div>
    </div>
    <div class="intro-status" id="introStatus">INITIATING SECURITY DISCOVERY...</div>
  </div>
  <button class="intro-skip-btn" onclick="skipIntro()">SKIP INTRO</button>
</div>

<nav>
  <div class="nav-brand">⬡ HYGIENEGUARD</div>
  <div class="nav-links">
    <a href="index.html" class="active">MONITOR</a>
    <a href="dashboard.html">VIOLATIONS</a>
    <a href="analytics.html">ANALYTICS</a>
  </div>
  <div style="display:flex;align-items:center;gap:1.5rem;">
    <!-- Camera Source Switcher -->
    <div id="cameraPanel" style="display:flex; align-items:center; gap:0.5rem;">
      <select id="cameraSource" style="
          font-family: Orbitron, monospace;
          font-size: 0.7rem;
          letter-spacing: 1px;
          padding: 0.5rem 0.8rem;
          background: rgba(0, 242, 254, 0.1);
          border: 1px solid var(--border);
          color: var(--green);
          border-radius: 6px;
          cursor: pointer;
          outline: none;
          transition: all 0.3s;">
          <option value="0" style="background:#0a0620; color:#fff;">💻 LAPTOP CAM</option>
          <option value="1" style="background:#0a0620; color:#fff;">📷 USB CAM</option>
          <option value="droidcam_wifi" style="background:#0a0620; color:#fff;">📱 DROIDCAM WIFI</option>
          <option value="http://localhost:4747/video" style="background:#0a0620; color:#fff;">🔌 DROIDCAM USB</option>
          <option value="custom" style="background:#0a0620; color:#fff;">✏ CUSTOM URL</option>
      </select>
      <input id="droidcamIp" type="text"
          placeholder="Enter DroidCam IP (e.g. 172.26.161.207)"
          style="display:none;
          font-family: Orbitron, monospace;
          font-size: 0.7rem; padding: 0.5rem;
          background: rgba(0,0,0,0.5);
          border: 1px solid var(--border);
          color: var(--green); border-radius: 6px;
          width: 210px;
          outline: none;"/>
      <input id="customUrl" type="text"
          placeholder="Enter camera URL"
          style="display:none;
          font-family: Orbitron, monospace;
          font-size: 0.7rem; padding: 0.5rem;
          background: rgba(0,0,0,0.5);
          border: 1px solid var(--border);
          color: var(--green); border-radius: 6px;
          width: 200px;
          outline: none;"/>
      <button class="btn btn-green" id="testCamBtn" onclick="testCamera()" style="padding:0.5rem 1rem;">TEST</button>
    </div>

    <div class="audio-bar" id="audioBar">
      <span></span><span></span><span></span><span></span><span></span>
    </div>
    <button id="muteBtn" onclick="toggleMute()" style="font-family:Orbitron; font-size:0.7rem; letter-spacing:2px; padding:0.5rem 1rem; border-radius:6px; border:1px solid #ffd700; background:rgba(255,215,0,0.1); color:#ffd700; cursor:pointer; font-weight:700;">🔊 SOUND ON</button>
    <div>
      <button class="btn btn-green" id="startBtn" onclick="startCamera()">▶ START</button>
      <button class="btn btn-red" id="stopBtn" onclick="stopCamera()" style="display:none">■ STOP</button>
    </div>
  </div>
</nav>

<div class="status-bar" id="statusBar">
  <div class="status-light" id="statusLight"></div>
  <div class="status-text clear" id="statusText">SYSTEM STATUS: READY FOR DISCOVERY</div>
</div>

<div class="monitor-layout">
  <!-- CAMERA VIEWPORT -->
  <div class="card" style="padding:0; overflow:hidden;">
    <div class="camera-wrapper" id="cameraContainer">
      <!-- Default placeholder canvas before active camera stream -->
      <div id="cameraPlaceholder" style="position:absolute; inset:0; display:flex; flex-direction:column; align-items:center; justify-content:center; background:#0c0f14; color:var(--text-muted); font-family:var(--font-display); font-size:0.85rem; letter-spacing:2px; text-shadow:0 0 10px rgba(0,255,136,0.1);">
        <span style="font-size:2rem; margin-bottom:1rem; animation:pulse-green 2s infinite;">⬡</span>
        SYSTEM OFFLINE. CLICK START TO LAUNCH STREAM.
      </div>
      
      <img id="cameraFeed" src="" alt="Camera Feed" style="display:none;">
      <div class="camera-overlay"></div>
    </div>
  </div>

  <!-- ACTIVE VIOLATIONS SIDEBAR PANEL -->
  <div class="violation-panel-wrapper" style="display:flex; flex-direction:column; gap:1rem;">
    <div class="card" style="flex:1; display:flex; flex-direction:column; gap:0.75rem; min-height:400px;">
      <div class="violation-panel" id="violationPanel">
        <div class="panel-header">
          <span class="panel-title">ACTIVE VIGILANCE TELEMETRY</span>
        </div>

        <!-- Total persons counter -->
        <div class="persons-counter">
          <span class="counter-icon">👥</span>
          <span class="counter-label">PERSONS DETECTED</span>
          <span class="counter-number" id="totalPersons">0</span>
        </div>

        <div class="divider"></div>

        <!-- Per person cards -->
        <div class="persons-list" id="personsList">
          <div style="text-align:center; color:var(--text-muted); font-family:var(--font-display); font-size:0.7rem; letter-spacing:2px; padding:1.5rem;">
            <span style="display:block; font-size:1.5rem; margin-bottom:0.5rem;">⬡</span>
            AWAITING STREAM INITIALIZATION
          </div>
        </div>
      </div>
    </div>
  </div>
</div>

<script src="js/intro.js"></script>
<script src="js/api.js?v=3.0"></script>
<script src="js/monitor.js?v=3.0"></script>
</body>
</html>
